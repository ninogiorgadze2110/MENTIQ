<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">M</span>
      <span class="brand-name">Mentiq</span>
    </div>

    <nav class="nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
        >
          <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <button type="button" class="btn btn-ghost logout" (click)="logout()">
      Sign out
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      @if (user(); as u) {
        <div class="user-chip">
          <span class="avatar">{{ u.displayName.charAt(0).toUpperCase() }}</span>
          <span class="user-name">{{ u.displayName }}</span>
        </div>
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>

  <div class="toasts">
    @for (n of notifications.notifications(); track n.id) {
      <div class="toast" [class]="'toast-' + n.kind">
        <span>{{ n.message }}</span>
        <button type="button" class="toast-close" (click)="dismiss(n.id)">×</button>
      </div>
    }
  </div>
</div>
