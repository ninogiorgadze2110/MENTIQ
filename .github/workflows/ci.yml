name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Mentiq.Client/package-lock.json

      # 1. Restore .NET dependencies
      - name: Restore .NET dependencies
        run: dotnet restore Mentiq.sln

      # 2 + 3 + 4. Install Angular deps, build Angular, copy output into wwwroot
      - name: Build Angular and copy to wwwroot
        run: |
          chmod +x scripts/build-production.sh
          ./scripts/build-production.sh --skip-publish

      # 5. Build ASP.NET Core
      - name: Build solution
        run: dotnet build Mentiq.sln --configuration Release --no-restore

      # 6. Run tests
      - name: Run tests
        run: dotnet test Mentiq.sln --configuration Release --no-build --verbosity normal

      # Produce the single deployable application as a build artifact.
      # A MonsterASP (or other) deployment step can be connected here later.
      - name: Publish application
        run: dotnet publish src/Mentiq.Api/Mentiq.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentiq-app
          path: ./publish
          retention-days: 7
